appId: com.omnicode.app
productName: Omni Code
copyright: Copyright © 2025
directories:
  output: dist-electron
  buildResources: build
files:
  - dist-electron/main/**/*
  - dist-electron/renderer/**/*
  - package.json
extraResources:
  - from: dist/
    to: core
    filter:
      - "**/*.js"
      - "**/*.js.map"
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  icon: build/icon.icns
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Development
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: omnicode
  repo: omni-code
