appId: com.omnicode.app
productName: Omni Code
copyright: Copyright © 2025
directories:
  output: dist-electron
  buildResources: build
files:
  - dist-electron/main/**/*
  - dist-electron/renderer/**/*
  - package.json
extraResources:
  - from: dist/
    to: core
    filter:
      - "**/*.js"
      - "**/*.js.map"
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.icns
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  icon: build/icon.png
  category: Development
publish:
  provider: github
  owner: omnicode
  repo: omni-code
